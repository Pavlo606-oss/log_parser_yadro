services:
  db:
    image: postgres:15-alpine
    container_name: log_parser-postgres
    environment:
      POSTGRES_USER: parser_user
      POSTGRES_PASSWORD: parser_pass
      POSTGRES_DB: parser_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/0001_init.up.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    networks:
      - parser-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parser_user -d parser_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parser-app
    environment:
      DATABASE_URL: postgres://parser_user:parser_pass@db:5432/parser_db?sslmode=disable
      PORT: ${PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - parser-network
    restart: unless-stopped

networks:
  parser-network:
    driver: bridge

volumes:
  postgres_data: